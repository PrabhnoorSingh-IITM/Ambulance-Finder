<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Hospitals - Smart Ambulance Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="bg-red-600 text-white p-6 shadow-xl">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <button onclick="window.location.href='index.html'" class="mr-6 text-white hover:text-red-200 transition-colors">
                        <i class="fas fa-arrow-left text-2xl"></i>
                    </button>
                    <h1 class="text-2xl font-black">Nearby Hospitals</h1>
                </div>
                <div class="text-lg opacity-90">
                    Location Found
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-6">
        <div id="hospitals-list" class="space-y-6">
            <!-- Hospitals will be loaded here -->
        </div>
    </div>

    <script>
        // Mock hospital data
        const hospitals = [
            {
                id: "1",
                name: "AIIMS Delhi",
                distance: 2.5,
                ambulanceAvailability: "available",
                hospitalPhone: "+91-11-26588500",
                ambulancePhone: "+91-11-26588500",
                lastUpdated: new Date(Date.now() - 15 * 60 * 1000)
            },
            {
                id: "2", 
                name: "Safdarjung Hospital",
                distance: 3.2,
                ambulanceAvailability: "busy",
                hospitalPhone: "+91-11-26702000",
                ambulancePhone: "+91-11-26702000",
                lastUpdated: new Date(Date.now() - 5 * 60 * 1000)
            },
            {
                id: "3",
                name: "Max Super Speciality Hospital",
                distance: 4.1,
                ambulanceAvailability: "available",
                hospitalPhone: "+91-11-40404040",
                ambulancePhone: "+91-11-40404040",
                lastUpdated: new Date(Date.now() - 30 * 60 * 1000)
            },
            {
                id: "4",
                name: "Apollo Hospital",
                distance: 5.8,
                ambulanceAvailability: "unknown",
                hospitalPhone: "+91-11-26925001",
                ambulancePhone: "+91-11-26925001",
                lastUpdated: new Date(Date.now() - 120 * 60 * 1000)
            },
            {
                id: "5",
                name: "Fortis Escorts Heart Institute",
                distance: 6.3,
                ambulanceAvailability: "available",
                hospitalPhone: "+91-11-42888888",
                ambulancePhone: "+91-11-42888888",
                lastUpdated: new Date(Date.now() - 45 * 60 * 1000)
            },
            {
                id: "6",
                name: "Sir Ganga Ram Hospital",
                distance: 7.2,
                ambulanceAvailability: "busy",
                hospitalPhone: "+91-11-42257000",
                ambulancePhone: "+91-11-42257000",
                lastUpdated: new Date(Date.now() - 20 * 60 * 1000)
            },
            {
                id: "7",
                name: "BLK Super Speciality Hospital",
                distance: 8.5,
                ambulanceAvailability: "available",
                hospitalPhone: "+91-11-26495050",
                ambulancePhone: "+91-11-26495050",
                lastUpdated: new Date(Date.now() - 10 * 60 * 1000)
            },
            {
                id: "8",
                name: "Indraprastha Apollo Hospital",
                distance: 9.1,
                ambulanceAvailability: "unknown",
                hospitalPhone: "+91-11-41755555",
                ambulancePhone: "+91-11-41755555",
                lastUpdated: new Date(Date.now() - 90 * 60 * 1000)
            }
        ];

        function formatTimeAgo(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff / 60)} minutes ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
            return `${Math.floor(diff / 86400)} days ago`;
        }

        function getStatusInfo(status) {
            switch(status) {
                case 'available':
                    return { color: 'text-green-600 bg-green-100 border-green-200', text: 'Available', icon: 'check-circle' };
                case 'busy':
                    return { color: 'text-red-600 bg-red-100 border-red-200', text: 'Busy', icon: 'times-circle' };
                default:
                    return { color: 'text-gray-600 bg-gray-100 border-gray-200', text: 'Unknown', icon: 'question-circle' };
            }
        }

        function callAmbulance(phone) {
            window.location.href = `tel:${phone}`;
        }

        function callHospital(phone) {
            window.location.href = `tel:${phone}`;
        }

        function renderHospitals() {
            const container = document.getElementById('hospitals-list');
            
            container.innerHTML = hospitals.map(hospital => {
                const statusInfo = getStatusInfo(hospital.ambulanceAvailability);
                
                return `
                    <div class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition-all border-2 border-gray-100">
                        <div class="flex flex-col lg:flex-row lg:justify-between lg:items-start mb-6">
                            <div class="flex-1">
                                <h3 class="text-2xl font-black text-gray-800 mb-3">${hospital.name}</h3>
                                <div class="flex items-center text-gray-700 mb-3 text-lg">
                                    <i class="fas fa-map-marker-alt mr-3 text-red-500 text-xl"></i>
                                    <span class="font-medium">${hospital.distance} km away</span>
                                </div>
                                <div class="flex items-center text-gray-500 text-base">
                                    <i class="fas fa-clock mr-2"></i>
                                    <span>Last updated: ${formatTimeAgo(hospital.lastUpdated)}</span>
                                </div>
                            </div>
                            <div class="lg:text-left mt-4 lg:mt-0">
                                <div class="inline-flex items-center px-4 py-2 rounded-full text-lg font-medium ${statusInfo.color} border mb-4">
                                    <i class="fas fa-${statusInfo.icon} mr-2"></i>
                                    <span>${statusInfo.text}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col lg:flex-row space-y-3 lg:space-y-0 lg:space-x-4">
                            <button 
                                onclick="callAmbulance('${hospital.ambulancePhone}')"
                                class="flex-1 px-6 py-4 rounded-xl font-medium transition-all transform hover:scale-105 ${
                                    hospital.ambulanceAvailability === 'available'
                                        ? 'bg-red-600 text-white hover:bg-red-700 shadow-lg'
                                        : 'bg-gray-300 text-gray-600 cursor-not-allowed'
                                }"
                                ${hospital.ambulanceAvailability !== 'available' ? 'disabled' : ''}
                            >
                                <i class="fas fa-ambulance mr-3 text-lg"></i>
                                <span class="text-lg">Call Ambulance</span>
                            </button>
                            <button 
                                onclick="callHospital('${hospital.hospitalPhone}')"
                                class="flex-1 bg-green-600 text-white px-6 py-4 rounded-xl font-medium hover:bg-green-700 transition-all transform hover:scale-105 shadow-lg"
                            >
                                <i class="fas fa-phone mr-3 text-lg"></i>
                                <span class="text-lg">Call Hospital</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load hospitals when page loads
        document.addEventListener('DOMContentLoaded', renderHospitals);
    </script>
</body>
</html>
