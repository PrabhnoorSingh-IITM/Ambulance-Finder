<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ambulance Finder</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRuKWFP-HU7g8a8a7g7h8i9j0k1l2m3n4&libraries=places&callback=initMap" async defer></script>
    <style>
        .emergency-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .status-available { color: #10b981; }
        .status-busy { color: #f59e0b; }
        .status-unavailable { color: #ef4444; }
        #map { 
            height: 400px; 
            border-radius: 0.5rem; 
            width: 100%;
        }
        .map-container {
            position: relative;
        }
        .hospital-marker {
            color: #dc2626;
            font-weight: bold;
        }
        .user-location-marker {
            color: #059669;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
