<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ambulance Finder</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRuKWFP-HU7g8a8a7g7h8i9j0k1l2m3n4&libraries=places&callback=initMap" async defer></script>
    <style>
        .emergency-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .status-available { color: #10b981; }
        .status-busy { color: #f59e0b; }
        .status-unavailable { color: #ef4444; }
        
        /* Responsive Map Styles */
        #map { 
            height: 300px; 
            border-radius: 0.5rem; 
            width: 100%;
        }
        
        @media (min-width: 768px) {
            #map {
                height: 400px;
            }
        }
        
        .map-container {
            position: relative;
        }
        
        .hospital-marker {
            color: #dc2626;
            font-weight: bold;
        }
        
        .user-location-marker {
            color: #059669;
        }
        
        /* Responsive Layout */
        .container {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        
        @media (min-width: 640px) {
            .container {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
        }
        
        @media (min-width: 1024px) {
            .container {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }
        
        /* Mobile Optimizations */
        @media (max-width: 767px) {
            .emergency-pulse {
                font-size: 0.875rem;
                padding: 0.5rem 1rem;
            }
            
            .text-2xl {
                font-size: 1.5rem;
            }
            
            .text-xl {
                font-size: 1.25rem;
            }
        }
        
        /* Touch-friendly buttons */
        @media (max-width: 640px) {
            button {
                min-height: 44px;
                min-width: 44px;
            }
        }
        
        /* Responsive Grid */
        @media (max-width: 767px) {
            .grid-cols-2 {
                grid-template-columns: repeat(1, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 640px) {
            .space-x-2 > * + * {
                margin-left: 0.25rem;
                margin-right: 0.25rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
